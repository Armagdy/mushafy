<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mushafy - Quran Explorer</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // This script redirects all 404 requests to the main page
    // while preserving the path in sessionStorage so the SPA can handle it
    var pathSegmentsToKeep = 1; // Keep '/mushafy' prefix

    var l = window.location;
    var repo = l.pathname.split('/')[1]; // 'mushafy'
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    
    // Store the path and search in sessionStorage
    sessionStorage.setItem('spa-redirect', JSON.stringify({
      path: '/' + path,
      search: l.search,
      hash: l.hash
    }));
    
    // Redirect to the base URL
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/' + repo + '/'
    );
  </script>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0;URL='/mushafy/'">
  </noscript>
</body>
</html>
