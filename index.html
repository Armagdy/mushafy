    <!-- PWA Theme Colors - matches TopBar for seamless native look -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <!-- iOS PWA settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>Mushafy - Quran Explorer</title>
    <meta name="description" content="Browse the Holy Quran with a unique spiritual experience" />

    <meta property="og:title" content="Mushafy - Quran Explorer" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- Icon URLs -->
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    
    <!-- SPA redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var data = JSON.parse(redirect);
          var targetUrl = data.path + data.search + data.hash;
          if (targetUrl !== '/' && targetUrl !== window.location.pathname) {
            history.replaceState(null, '', targetUrl);
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
